  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
  return new Uint8Array(await crypto.subtle.exportKey("raw",k));
}
