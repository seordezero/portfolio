<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAPEA App (Carabanchel) &middot; cabida</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--panel:#1A1A1A; --line:#262626; --line-2:#2E2E2E; --ink:#F2F2F2;
  --ink-2:#C9C9C9; --muted:#8A8A8A; --acc:#E4DBC6; --sel:#1B54E0; --sel-ink:#5C8CF7;
  /* Aqui no hay seleccion -se llega con un lote ya elegido-, asi que no hay
     amarillo. Crema para lo que esta, indigo para lo que cabe, verde solo para
     lo que es verde. */
  --verde:#4E7F45}
html,body{height:100%;margin:0}
body{background:#000;color:var(--ink);font-family:Archivo,system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden}
.esquina{position:fixed;top:20px;right:26px;z-index:80;display:flex;
  align-items:center;gap:14px}
.sesion-chip{position:relative;display:inline-flex;align-items:center}
.ava{width:31px;height:31px;border-radius:50%;border:0;cursor:pointer;
  background:var(--acc);color:var(--sel);font:inherit;font-size:14px;font-weight:700;
  line-height:1;display:grid;place-items:center;padding:0}
.avamenu{position:absolute;top:38px;right:0;min-width:184px;z-index:90;
  background:rgba(26,26,26,.96);backdrop-filter:blur(7px);
  border:1px solid var(--line-2);border-radius:6px;padding:11px 13px;
  display:flex;flex-direction:column;gap:9px;text-align:left}
/* display:flex de la clase gana a display:none de [hidden]: hay que decirlo. */
.avamenu[hidden]{display:none}
.avamenu span{font-size:11.5px;color:var(--muted);word-break:break-all}
.avamenu button{border:1px solid var(--line-2);border-radius:4px;padding:5px 9px;
  background:none;color:var(--ink);font:inherit;font-size:12px;cursor:pointer}
.avamenu button:hover{border-color:var(--acc);color:var(--acc)}
.btn{border:1px solid var(--line-2);border-radius:4px;
  background:rgba(26,26,26,.82);backdrop-filter:blur(6px);
  color:var(--ink);font:inherit;font-size:12px;padding:6px 11px;cursor:pointer;
  text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--acc);color:var(--acc)}
h1{margin:0;padding:26px 32px 16px;font-size:15px;font-weight:600}
h1 b{color:var(--sel-ink)}
h1 span{color:var(--muted);font-weight:400;font-size:12px;margin-left:10px}
main{flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(0,1fr) 316px;gap:26px;padding:0 32px 28px}
.vista{position:relative;border:1px solid var(--line);border-radius:5px;
  background:var(--panel);overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
.mandos{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:5px}
.mandos .btn{padding:5px 9px;background:var(--panel)}
.leyenda{position:absolute;left:12px;bottom:12px;font-size:11px;color:var(--muted);
  background:rgba(10,10,10,.72);padding:8px 10px;border-radius:4px;line-height:1.7}
.leyenda i{display:inline-block;width:11px;height:11px;border-radius:2px;
  margin-right:7px;vertical-align:-1px}
/* La pagina no se desplaza; la columna de fichas si, por dentro, como el panel
   de resultados del navegador. Con la proto-cabida y los pasos son cinco fichas
   y en una pantalla baja no caben sin apretarlas hasta no leerse. */
aside{display:flex;flex-direction:column;gap:16px;min-height:0;overflow-y:auto;
  padding-right:2px}
.tar{border:1px solid var(--line);border-radius:5px;background:var(--panel);
  padding:16px 18px;flex:none}
.tar h2{margin:0 0 9px;font-size:10.5px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--sel-ink)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0}
dt{font-size:11px;color:var(--muted)}
dd{margin:0;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.gordo{font-size:22px;font-weight:700;color:var(--acc);text-align:right;
  font-variant-numeric:tabular-nums}
.nota{font-size:10.5px;color:var(--muted);line-height:1.55}
ol.pasos{margin:0;padding-left:16px;font-size:11px;color:var(--ink-2);line-height:1.55}
ol.pasos li{margin-bottom:5px}
ol.pasos li:last-child{margin-bottom:0}
ol.pasos b{color:var(--ink);font-weight:600}
.imprimir{width:100%;margin-top:11px;text-align:center}
/* Al imprimir sobra todo lo que no es informacion: mandos, esquina y leyenda.
   El lienzo sale tal cual esta en pantalla, que es justo lo que se quiere. */
@media print{
  body{background:#fff;color:#111;display:block;overflow:visible;height:auto}
  .esquina,.mandos,.imprimir{display:none !important}
  h1{color:#111;padding:0 0 10px}
  h1 b{color:#1B54E0}
  main{display:block;padding:0}
  .vista{height:78mm;border-color:#bbb;background:#141414;page-break-inside:avoid}
  aside{display:block;overflow:visible;margin-top:8mm}
  .tar{border-color:#ccc;background:#fff;margin-bottom:5mm;page-break-inside:avoid}
  .tar h2{color:#1B54E0}
  dt,.nota{color:#555} dd,ol.pasos{color:#111}
  .gordo{color:#111}
  .leyenda{background:none;color:#555}
}
.vacio{flex:1;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;text-align:center;padding:26px}
@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;
    padding:0 12px 14px;gap:10px}
  h1{padding:44px 12px 8px;font-size:13px}
  aside{flex-direction:row;gap:10px}
  .tar{flex:1;padding:9px 11px}
  .esquina{top:10px;right:12px}
}
</style>
</head>
<body>
<div class="esquina"><a class="btn" href="../">Volver</a><span class="sesion-chip" id="ses"></span></div>
<h1 id="tit">Cabida arquitect&oacute;nica</h1>
<main id="cuerpo">
  <div class="vista">
    <canvas id="c"></canvas>
    <div class="mandos">
      <button class="btn" id="mas">&#65291;</button>
      <button class="btn" id="menos">&minus;</button>
      <button class="btn" id="fit">Ajustar</button>
    </div>
    <div class="leyenda">
      <div><i style="background:#E4DBC6"></i>Construido hoy</div>
      <div><i style="background:#1B54E0"></i>Lo que cabe encima</div>
      <div><i style="background:#4E7F45"></i>Verde y arbolado</div>
      <div><i style="background:#3A3A3A"></i>Parcela</div>
      <div><i style="background:#242424"></i>Manzana alrededor</div>
      <div><i style="background:#1A1A1A"></i>Viario (calzada y acera)</div>
    </div>
  </div>
  <aside id="datos"></aside>
</main>
<script>
(function(){
  var H_PISO = 3.5;                 // m; la misma tabla del PGOUM que usa la app
  var d = null;
  try{ d = JSON.parse(localStorage.getItem("mapea.cabida")); }catch(e){}

  var cuerpo = document.getElementById("cuerpo");
  if(!d || !d.parcela || !d.parcela.length){
    cuerpo.innerHTML = '<div class="vacio">Elige un lote guardado en el comparador '+
      'y pulsa <b>Generar cabida arquitect&oacute;nica</b>.</div>';
    return;
  }

  document.getElementById("tit").innerHTML =
    'Cabida &middot; <b>'+esc(d.dir||d.refcat)+'</b><span>'+esc(d.refcat)+'</span>';

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function fmt(v,n){ return (+v||0).toLocaleString("es-ES",
    {minimumFractionDigits:n,maximumFractionDigits:n}); }

  // ---------------------------------------------------------------- los datos
  var hHoy = d.ha > 0 ? d.ha : d.pa * H_PISO;
  var hTope = d.pm * H_PISO;
  var altoTotal = Math.max(hHoy, hTope);
  var suben = Math.max(0, d.pm - d.pa);
  /* Superficie de las huellas por el teorema del zapato. Es la ocupacion real
     medida sobre el poligono catastral, no el area de la parcela por un
     coeficiente: aqui no hay coeficiente que valga, hay un edificio dibujado. */
  function areaAnillo(p){
    var a=0, n=p.length;
    for(var i=0;i<n;i+=2){
      var j=(i+2)%n;
      a += p[i]*p[j+1] - p[j]*p[i+1];
    }
    return Math.abs(a)/2;
  }
  var huella = (d.edificios||[]).reduce(function(t,p){ return t+areaAnillo(p); }, 0);
  var ocupa  = d.area>0 ? huella/d.area*100 : 0;
  var cHoy   = huella * d.pa;
  var cTope  = huella * d.pm;
  var edifb  = d.area>0 ? cTope/d.area : 0;
  var vivs   = Math.floor(cTope/90);           // 90 m2c por vivienda, orientativo
  document.getElementById("datos").innerHTML =
    '<div class="tar"><h2>Potencial</h2>'+
      '<div class="gordo">'+fmt(d.potencial,0)+' m&sup2;</div>'+
      '<p class="nota">'+(suben>0
        ? 'Caben '+suben+' plantas m&aacute;s sobre lo construido.'
        : 'El lote ya ha agotado su edificabilidad.')+'</p></div>'+
    '<div class="tar"><h2>El lote</h2><dl>'+
      fila("&Aacute;rea", fmt(d.area,0)+" m&sup2;")+
      fila("Zonificaci&oacute;n", esc(d.zona||"&mdash;"))+
      fila("Plantas construidas", d.pa+" p &middot; ~"+fmt(hHoy,1)+" m")+
      fila("Plantas permitidas", d.pm+" p &middot; ~"+fmt(hTope,1)+" m")+
      fila("Valor &euro; por m&sup2;", d.vm ? fmt(d.vm,0)+" "+esc(d.moneda)+"/m&sup2;" : "&mdash;")+
    '</dl></div>'+
    '<div class="tar"><h2>Proto-cabida</h2><dl>'+
      fila("Ocupaci&oacute;n en planta", fmt(huella,0)+" m&sup2; &middot; "+fmt(ocupa,0)+"&#37;")+
      fila("Construido hoy", fmt(cHoy,0)+" m&sup2;c")+
      fila("Techo m&aacute;ximo", fmt(cTope,0)+" m&sup2;c")+
      fila("Edificabilidad", fmt(edifb,2)+" m&sup2;c/m&sup2;s")+
      fila("Viviendas orientativas", vivs>0 ? "~"+vivs+" de 90 m&sup2;c" : "&mdash;")+
    '</dl><p class="nota">El s&oacute;lido es la huella catastral por su altura '+
      'real; el fantasma, esa misma huella hasta la altura que permite la norma. '+
      'Una cabida completa a&ntilde;ade lo que aqu&iacute; no hay: retranqueos, '+
      'fondo edificable, patios, usos, bajo rasante y aparcamiento.</p></div>'+
    '<div class="tar"><h2>Pr&oacute;ximos pasos</h2><ol class="pasos">'+
      '<li><b>Nota simple</b> en el Registro de la Propiedad: qui&eacute;n es el '+
        'titular y qu&eacute; cargas arrastra la finca.</li>'+
      '<li><b>Consulta descriptiva y gr&aacute;fica</b> en la Sede del Catastro, '+
        'con la referencia de arriba.</li>'+
      '<li><b>Consulta urban&iacute;stica</b> al Ayuntamiento: los par&aacute;metros '+
        'vinculantes son los suyos, no los de esta pantalla.</li>'+
      '<li><b>Estudio de cabida completo</b> con un arquitecto, ya con '+
        'retranqueos, patios y usos.</li>'+
      '<li><b>Contacto con la propiedad</b> y, si hay acuerdo, contrato de '+
        'arras ante la oferta en firme.</li>'+
    '</ol><button class="btn imprimir" type="button" id="imprimir">'+
      'Imprimir informaci&oacute;n</button></div>';
  document.getElementById("imprimir").onclick=function(){ window.print(); };
  /* La sesion, la misma que en el resto de la app: circulo crema con la inicial. */
  (function(){
    var ses=null;
    try{ ses=JSON.parse(localStorage.getItem("mapea.sesion")); }catch(e){}
    var caja=document.getElementById("ses");
    if(!caja || !(ses && ses.correo)) return;
    var co=esc(ses.correo);
    caja.innerHTML = "<button type='button' class='ava' title='"+co+"'>"+
      co.charAt(0).toUpperCase()+"</button><div class='avamenu' hidden><span>"+
      co+"</span><button type='button' data-salir>Salir</button></div>";
    var m=caja.querySelector(".avamenu");
    caja.querySelector(".ava").onclick=function(){ m.hidden=!m.hidden; };
    caja.querySelector("[data-salir]").onclick=function(){
      localStorage.removeItem("mapea.sesion"); caja.innerHTML="";
    };
    document.addEventListener("click", function(ev){
      if(!caja.contains(ev.target)) m.hidden=true;
    });
  })();
  function fila(k,v){ return "<dt>"+k+"</dt><dd>"+v+"</dd>"; }

  // ------------------------------------------------------------ axonometria
  var cv = document.getElementById("c"), cx = cv.getContext("2d");
  var W=0, H=0, esc0=1, giro=Math.PI/4, k=1, arrastra=null;
  var COS=Math.cos(Math.PI/6), SEN=Math.sin(Math.PI/6);

  /* El volumen se centra ENTERO, no por su planta a cota cero. Subir medio alto
     total pone el centro del prisma en el centro del lienzo; si no, el solido
     cuelga hacia abajo y el fantasma se sale por arriba. */
  function proj(x,y,z){
    var xr = x*Math.cos(giro) - y*Math.sin(giro);
    var yr = x*Math.sin(giro) + y*Math.cos(giro);
    return [(xr-yr)*COS*esc0*k, ((xr+yr)*SEN - z + altoTotal/2)*esc0*k];
  }
  function cara(pts, relleno, borde, alfa){
    cx.beginPath();
    for(var i=0;i<pts.length;i++){
      var p=proj(pts[i][0],pts[i][1],pts[i][2]);
      if(i===0) cx.moveTo(W/2+p[0], H/2+p[1]); else cx.lineTo(W/2+p[0], H/2+p[1]);
    }
    cx.closePath();
    if(relleno){ cx.globalAlpha=alfa==null?1:alfa; cx.fillStyle=relleno; cx.fill(); }
    cx.globalAlpha=1;
    if(borde){ cx.strokeStyle=borde; cx.lineWidth=1; cx.stroke(); }
  }
  /* Prisma: se pintan primero las paredes que quedan detras y luego las de
     delante, ordenadas por profundidad del punto medio. Es el algoritmo del
     pintor: sin z-buffer, el orden ES la oclusion. */
  function prisma(anillo, z0, z1, color, borde, alfa){
    var n=anillo.length/2, muros=[];
    for(var i=0;i<n;i++){
      var j=(i+1)%n;
      var ax=anillo[2*i], ay=anillo[2*i+1], bx=anillo[2*j], by=anillo[2*j+1];
      var mx=(ax+bx)/2, my=(ay+by)/2;
      var mr = mx*Math.sin(giro) + my*Math.cos(giro) + (mx*Math.cos(giro)-my*Math.sin(giro));
      muros.push([mr, [[ax,ay,z0],[bx,by,z0],[bx,by,z1],[ax,ay,z1]]]);
    }
    muros.sort(function(p,q){ return p[0]-q[0]; });
    for(var m=0;m<muros.length;m++) cara(muros[m][1], color, borde, alfa);
    var techo=[];
    for(var t=0;t<n;t++) techo.push([anillo[2*t], anillo[2*t+1], z1]);
    cara(techo, aclara(color), borde, alfa);
  }
  function aclara(c){
    if(c.charAt(0)!=="#") return c;
    var v=parseInt(c.slice(1),16), r=v>>16&255, g=v>>8&255, b=v&255;
    return "rgb("+Math.min(255,r+38)+","+Math.min(255,g+38)+","+Math.min(255,b+38)+")";
  }

  function anillo(a, z){
    var o=[]; for(var i=0;i<a.length;i+=2) o.push([a[i],a[i+1],z]);
    return o;
  }
  /* Un arbol no es un modelo, es una escala: con el se sabe que el edificio
     tiene cuatro plantas y no dos. Tronco y copa, nada mas. */
  function arbol(x, y){
    var t=proj(x,y,0), c1=proj(x,y,5);
    cx.strokeStyle="#2E4A2A"; cx.lineWidth=Math.max(1, 1.4*esc0*k);
    cx.beginPath(); cx.moveTo(W/2+t[0], H/2+t[1]);
    cx.lineTo(W/2+c1[0], H/2+c1[1]); cx.stroke();
    cx.fillStyle="#4E7F45"; cx.globalAlpha=.85;
    cx.beginPath(); cx.arc(W/2+c1[0], H/2+c1[1], Math.max(2, 2.4*esc0*k), 0, 6.2832);
    cx.fill(); cx.globalAlpha=1;
  }
  function pinta(){
    cx.fillStyle="#141414"; cx.fillRect(0,0,W,H);
    // el viario primero: es el suelo sobre el que se apoya todo lo demas
    (d.vias||[]).forEach(function(v){ cara(anillo(v,0), "#1A1A1A", "#262626"); });
    // lo verde de verdad: el unico color que no es ni crema ni indigo
    (d.verdes||[]).forEach(function(v){ cara(anillo(v,0), "#1B2A18", "#4E7F45"); });
    var p=d.parcela;
    cara(anillo(p,0), "#2A2A2A", "#4A4A4A");
    /* Los prismas tambien se ordenan entre si, no solo sus muros: con varios
       edificios en la parcela, pintar en el orden del fichero tapa el de delante
       con el de detras. La profundidad es la del centroide girado. */
    function hondo(a){
      var sx=0, sy=0, n=a.length/2;
      for(var i=0;i<a.length;i+=2){ sx+=a[i]; sy+=a[i+1]; }
      sx/=n; sy/=n;
      return sx*Math.sin(giro)+sy*Math.cos(giro) + (sx*Math.cos(giro)-sy*Math.sin(giro));
    }
    (d.vecinos||[]).slice().sort(function(a,b){ return hondo(a.p)-hondo(b.p); })
      .forEach(function(v){ prisma(v.p, 0, v.h, "#242424", "#343434"); });
    (d.arboles||[]).forEach(function(a){ arbol(a[0], a[1]); });
    var orden = d.edificios.slice().sort(function(a,b){ return hondo(a)-hondo(b); });
    orden.forEach(function(a){ prisma(a, 0, hHoy, "#E4DBC6", "#F2ECDD"); });
    if(hTope > hHoy + 0.1){
      if(d.edificios.length)
        orden.forEach(function(a){ prisma(a, hHoy, hTope, "#1B54E0", "#4F7DEF", 0.42); });
      else                              // solar sin edificar: el envolvente es la parcela
        prisma(p, 0, hTope, "#1B54E0", "#4F7DEF", 0.32);
    }
  }

  function ajusta(){
    var r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    W=Math.round(r.width); H=Math.round(r.height);
    cv.width=W*dpr; cv.height=H*dpr;
    cx.setTransform(dpr,0,0,dpr,0,0);
    /* La escala se calcula con el RADIO en planta, no con la caja de este giro:
       asi el encuadre no depende de como este girado el modelo y girar no saca
       nada de la pantalla. Un punto a radio r cae, como mucho, a r*raiz(2)*COS
       de ancho y a r*raiz(2)*SEN de alto; la altura suma entera.
       La manzana NO entra: si entrara, un lote de 115 m2 y otro de 5.000
       saldrian a la misma escala, la del radio de contexto. */
    var r=0;
    function mide(a){
      for(var i=0;i<a.length;i+=2) r=Math.max(r, Math.hypot(a[i], a[i+1]));
    }
    mide(d.parcela);
    (d.edificios||[]).forEach(mide);
    var diag = Math.max(r, 7) * Math.SQRT2;
    var anchoNec = 2*diag*COS;
    var altoNec  = altoTotal + 2*diag*SEN;
    esc0 = Math.min(W*0.84/(anchoNec||1), H*0.84/(altoNec||1));
    pinta();
  }
  document.getElementById("mas").onclick=function(){ k*=1.25; pinta(); };
  document.getElementById("menos").onclick=function(){ k/=1.25; pinta(); };
  document.getElementById("fit").onclick=function(){ k=1; giro=Math.PI/4; pinta(); };
  /* Un dedo gira, dos pellizcan. Se lleva la cuenta de los punteros vivos
     porque en un movil no hay rueda: sin el pellizco no hay forma de acercarse. */
  var dedos={}, pellizco=0;
  function separacion(){
    var v=[]; for(var id in dedos) v.push(dedos[id]);
    if(v.length<2) return 0;
    return Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y);
  }
  cv.addEventListener("pointerdown", function(e){
    dedos[e.pointerId]={x:e.clientX, y:e.clientY};
    cv.setPointerCapture(e.pointerId);
    pellizco = separacion();
    arrastra = pellizco ? null : e.clientX;   // con dos dedos no se gira
  });
  cv.addEventListener("pointermove", function(e){
    if(!(e.pointerId in dedos)) return;
    dedos[e.pointerId]={x:e.clientX, y:e.clientY};
    var sep = separacion();
    if(sep && pellizco){
      k *= sep/pellizco; pellizco = sep; pinta(); return;
    }
    if(arrastra==null) return;
    giro += (e.clientX-arrastra)*0.008; arrastra=e.clientX; pinta();
  });
  function soltar(e){
    delete dedos[e.pointerId];
    pellizco = separacion();
    // al levantar un dedo del pellizco, el que queda no debe dar un tiron
    arrastra = null;
  }
  cv.addEventListener("pointerup", soltar);
  cv.addEventListener("pointercancel", soltar);
  cv.addEventListener("wheel", function(e){
    e.preventDefault(); k *= e.deltaY<0 ? 1.12 : 1/1.12; pinta();
  }, {passive:false});
  /* ResizeObserver y no el evento resize: la primera medida del lienzo llega
     antes de que el navegador haya repartido el ancho entre mapa y ficha, y con
     ella el encuadre salia mal. El observador vuelve a encuadrar en cuanto el
     lienzo tiene su tamano de verdad, y tambien si luego cambia. */
  if(window.ResizeObserver) new ResizeObserver(ajusta).observe(cv);
  else addEventListener("resize", ajusta);
  ajusta();
})();
</script>
</body>
